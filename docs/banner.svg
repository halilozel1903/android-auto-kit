<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="android-auto-kit: Android Auto apps without the boilerplate" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#14304f"/>
    </linearGradient>
    <linearGradient id="dash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f26"/>
      <stop offset="1" stop-color="#0d1015"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="screen"><rect width="600" height="225" rx="14"/></clipPath>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <g font-family="'Google Sans', Roboto, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="150" fill="#ffffff" font-size="60" font-weight="800" letter-spacing="-2">android-auto-kit</text>
    <text x="74" y="204" fill="#c9dcff" font-size="26" font-weight="500">Android Auto apps without the boilerplate:</text>
    <text x="74" y="240" fill="#c9dcff" font-size="26" font-weight="500">Car App Library templates from a small model</text>
    <text x="74" y="296" fill="#8ab4f8" font-size="19" font-family="'JetBrains Mono', Menlo, monospace">templates.list(stops) { row -&gt; push(StopScreen(row.id)) }</text>
    <g font-size="18" font-weight="600" fill="#e3ecff">
      <rect x="74" y="330" width="80" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="114" y="355" text-anchor="middle">Lists</text>
      <rect x="166" y="330" width="80" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="206" y="355" text-anchor="middle">Grids</text>
      <rect x="258" y="330" width="82" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="299" y="355" text-anchor="middle">Panes</text>
      <rect x="352" y="330" width="86" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="395" y="355" text-anchor="middle">Media</text>
      <rect x="450" y="330" width="132" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="516" y="355" text-anchor="middle">Navigation</text>
    </g>
    <text x="74" y="412" fill="#c9dcff" font-size="18" font-weight="500">Validation against host limits · Paging · "In 300 m, turn right"</text>
    <text x="74" y="444" fill="#c9dcff" font-size="18" font-weight="500">Base CarAppService, Session and Screen · Phone preview · Tests</text>
    <text x="74" y="500" fill="#8ab4f8" font-size="17" font-weight="600" fill-opacity="0.85">Car App Library 1.7 · Kotlin · minSdk 24 · Robolectric and app-testing</text>

    <g transform="translate(770 160) scale(0.75)" filter="url(#shadow)">
      <rect x="-20" y="-20" width="640" height="265" rx="26" fill="url(#dash)"/>
      <g clip-path="url(#screen)">
        <rect width="600" height="225" fill="#000000"/>
        <rect width="46" height="225" fill="#121314"/>
        <text x="23" y="24" fill="#f1f3f4" font-size="11" font-weight="600" text-anchor="middle">9:41</text>
        <path d="M23 70 l-6 14 l6 -3 l6 3 z" fill="#b0b4ba"/>
        <rect x="13" y="98" width="20" height="20" rx="5" fill="#1a73e8"/>
        <circle cx="23" cy="104" r="3" fill="#ffc66d"/>
        <path d="M21 118 l1 -8 h2 l1 8 z" fill="#5f6368"/>
        <rect x="18" y="200" width="10" height="10" rx="1" fill="#b0b4ba"/>

        <circle cx="72" cy="28" r="14" fill="#2d2e31"/>
        <path d="M78 28 h-11 m4 -5 l-5 5 5 5" stroke="#f1f3f4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="96" y="34" fill="#f1f3f4" font-size="16" font-weight="500">Route to Lighthouse Bay</text>

        <rect x="58" y="52" width="530" height="164" rx="10" fill="#202124"/>
        <g font-size="12">
          <path d="M76 82 v-7 q0 -4 4 -4 h6" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <path d="M85 67 l5 4 l-5 4 z" fill="#ffffff"/>
          <text x="104" y="72" fill="#f1f3f4" font-weight="500">In 300 m, turn right onto Coast Road</text>
          <text x="104" y="87" fill="#b0b4ba" font-size="10">Coast Road · 300 m</text>
          <line x1="58" y1="96" x2="588" y2="96" stroke="#3c4043"/>
          <circle cx="81" cy="112" r="4" fill="none" stroke="#ffffff" stroke-width="2"/>
          <path d="M81 116 v8 M84 109 l3 -3" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
          <text x="104" y="114" fill="#f1f3f4" font-weight="500">In 1.2 km, at the roundabout, take the 2nd exit</text>
          <text x="104" y="129" fill="#b0b4ba" font-size="10">Cliff Drive · 1.2 km</text>
          <line x1="58" y1="138" x2="588" y2="138" stroke="#3c4043"/>
          <path d="M84 166 v-7 l-6 -6" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <path d="M75 149 h6 l-6 6 z" fill="#ffffff"/>
          <text x="104" y="156" fill="#f1f3f4" font-weight="500">In 4.5 km, bear left onto Lighthouse Lane</text>
          <text x="104" y="171" fill="#b0b4ba" font-size="10">Lighthouse Lane · 4.5 km</text>
          <line x1="58" y1="180" x2="588" y2="180" stroke="#3c4043"/>
          <path d="M81 186 c-4 0 -6 3 -6 6 c0 4 6 11 6 11 s6 -7 6 -11 c0 -3 -2 -6 -6 -6 z" fill="#ffffff"/>
          <text x="104" y="198" fill="#f1f3f4" font-weight="500">In 850 m, Lighthouse Bay is on the right</text>
        </g>
      </g>
    </g>
    <g transform="translate(755 400)" font-size="14" fill="#c9dcff">
      <rect width="480" height="52" rx="14" fill="#ffffff" fill-opacity="0.06"/>
      <text x="20" y="32" font-family="'JetBrains Mono', Menlo, monospace" fill="#8ab4f8">CarList · CarGrid · CarPane · MediaQueue · Route</text>
    </g>
  </g>
</svg>
